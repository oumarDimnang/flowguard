[project]
name = "flowguard-agent"
version = "0.1.0"
description = "FlowGuard AI agent — Temporal worker orchestrating CAMARA network APIs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "temporalio>=1.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openrouter = ["langchain-openrouter>=0.1"]
nokia = ["network-as-code>=3.0"]
langfuse = ["langfuse>=4.0", "langchain>=0.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
flowguard-worker = "flowguard_agent.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowguard_agent"]
# Prompt templates are data, not code — without this they are absent from an
# installed wheel and every prompt lookup fails at runtime.
artifacts = ["src/flowguard_agent/prompts/templates/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
