<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowGuard</title>
    <script>
      // Applied before the first paint, deliberately outside React.
      //
      // If the class were only set by an effect, a dark-mode user would see a
      // full frame of light paper before it swapped — and on the decision
      // graph, whose whole palette inverts, that flash is violent rather than
      // merely untidy. Wrapped because `localStorage` throws outright in a
      // private window, and a theme preference is not worth a blank screen.
      try {
        if (localStorage.getItem('flowguard.theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
